<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rmd Pack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Lora:wght@400;600&family=Readex+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EBF1E6; --paper:#FBFAF3; --ink:#25382B; --muted:#68796B;
  --moss:#5E8B53; --moss-d:#41683B; --moss-l:#DCE8D0;
  --ochre:#CF9E3A; --ochre-l:#F0E5BF; --sand:#E7E0CA;
  --line:#D3DDC6; --danger:#B4553B;
  --shadow:0 1px 0 rgba(37,56,43,.05),0 10px 24px -14px rgba(37,56,43,.35);
  --shadow-up:0 2px 0 rgba(37,56,43,.05),0 18px 30px -14px rgba(37,56,43,.4);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Readex Pro','Segoe UI',Tahoma,sans-serif;line-height:1.6;min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ochre);outline-offset:2px;border-radius:8px}
.ic{width:20px;height:20px;flex:none}
[dir=ltr] .ic-back{transform:scaleX(-1)}

.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 14px;background:var(--paper);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 10px 22px}
.brand svg{width:40px;height:40px}
.brand b{font-size:1.25rem;font-weight:600;letter-spacing:.2px;display:block;line-height:1.2}
.brand small{color:var(--muted);font-size:.78rem}
.nav{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;background:transparent;border-radius:14px;text-align:start;font-weight:500;color:var(--ink);position:relative;transition:background .25s,padding .25s}
.nav:hover{background:var(--moss-l);padding-inline-start:20px}
.nav:hover .ic{animation:wig .5s}
.nav.on{background:var(--moss-d);color:#fff}
.nav.on::after{content:'';position:absolute;inset-inline-end:-14px;top:22%;bottom:22%;width:5px;border-radius:5px 0 0 5px;background:var(--ochre);animation:grow .35s}
[dir=ltr] .nav.on::after{border-radius:0 5px 5px 0}
@keyframes wig{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
@keyframes grow{from{transform:scaleY(0)}}
.sidefoot{margin-top:auto;padding:10px;color:var(--muted);font-size:.8rem}

.main{padding:0 clamp(16px,4vw,44px) 110px;min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:20px 0 16px;position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 78%,transparent)}
.top h1{margin:0;font-size:clamp(1.3rem,2.6vw,1.8rem);font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 12px;transition:transform .2s,background .2s,box-shadow .2s}
.iconbtn:hover{background:var(--moss-l);transform:translateY(-2px);box-shadow:var(--shadow)}

.view.enter{animation:enter .4s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}

.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-weight:500;transition:transform .2s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn:active{transform:translateY(0) scale(.97)}
.btn.primary{background:var(--moss-d);border-color:var(--moss-d);color:#fff}
.btn.primary:hover{background:#365a31}
.btn.danger{color:var(--danger);border-color:#E6C7BC}
.btn.danger.fill{background:var(--danger);color:#fff;border-color:var(--danger)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card,.tile{position:relative;border-radius:20px;padding:20px;cursor:pointer;box-shadow:var(--shadow);transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;border:1px solid rgba(37,56,43,.08);overflow:hidden}
.card{min-height:170px}
.tile{aspect-ratio:1}
.card:hover,.tile:hover{transform:translateY(-6px) rotate(-.6deg);box-shadow:var(--shadow-up)}
.card:active,.tile:active{transform:scale(.97)}
.c0{background:#DCE8D0}.c1{background:#F0E5BF}.c2{background:#CFE3CC}.c3{background:#E7E0CA}.c4{background:#E3EBC9}
.card h3,.tile h3{margin:0;font-size:1.1rem;font-weight:600;line-height:1.35;word-break:break-word}
.card .big{position:absolute;inset-block-start:16px;inset-inline-start:18px;width:46px;height:46px;color:var(--moss-d);opacity:.9;transition:transform .35s}
.card:hover .big{transform:scale(1.15) rotate(-6deg)}
.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.85rem}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta .ic{width:16px;height:16px}
.acts{position:absolute;inset-block-start:10px;inset-inline-end:10px;display:flex;gap:4px;opacity:0;transform:translateY(-4px);transition:.2s}
.card:hover .acts,.tile:hover .acts,.acts:focus-within{opacity:1;transform:none}
@media (hover:none){.acts{opacity:1;transform:none}}
.acts button{border:0;background:rgba(251,250,243,.9);border-radius:10px;width:32px;height:32px;display:grid;place-items:center;transition:transform .2s,background .2s}
.acts button:hover{transform:scale(1.12);background:#fff}
.acts .ic{width:17px;height:17px}

.empty{display:grid;place-items:center;text-align:center;gap:6px;padding:60px 20px;border:2px dashed #B9C9A8;border-radius:22px;color:var(--muted);background:rgba(251,250,243,.5)}
.empty .ic{width:44px;height:44px;color:var(--moss);animation:float 3s ease-in-out infinite}
.empty b{color:var(--ink);font-size:1.1rem}
@keyframes float{50%{transform:translateY(-6px)}}

.fab{position:fixed;inset-inline-end:26px;bottom:26px;z-index:20;display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border:0;border-radius:18px;background:var(--moss-d);color:#fff;font-weight:500;box-shadow:0 14px 26px -10px rgba(37,56,43,.6);transition:transform .25s,background .2s}
.fab:hover{transform:translateY(-4px) scale(1.03);background:#365a31}
.fab:active{transform:scale(.96)}
.fab-side{position:fixed;inset-inline-end:0;top:45%;z-index:20;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 12px;border:0;background:var(--ochre);color:#2b2308;font-weight:600;border-start-start-radius:18px;border-end-start-radius:18px;box-shadow:0 14px 26px -12px rgba(37,56,43,.55);writing-mode:vertical-rl;transition:padding .25s,background .2s}
.fab-side .ic{writing-mode:horizontal-tb}
.fab-side:hover{padding-inline-end:22px;background:#d9ac4d}

.tabs{display:flex;gap:6px;background:var(--paper);border:1px solid var(--line);padding:5px;border-radius:16px;width:max-content;max-width:100%;overflow:auto;margin-bottom:22px}
.tab{border:0;background:transparent;padding:9px 16px;border-radius:12px;display:inline-flex;align-items:center;gap:8px;font-weight:500;white-space:nowrap;transition:background .25s,color .25s}
.tab:hover{background:var(--moss-l)}
.tab.on{background:var(--moss-d);color:#fff}

.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.thumb{padding:0;border:0;border-radius:16px;overflow:hidden;aspect-ratio:1;background:var(--sand);box-shadow:var(--shadow);transition:transform .3s,box-shadow .3s;animation:pop .4s backwards}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.thumb:hover{transform:translateY(-4px);box-shadow:var(--shadow-up)}
.thumb:hover img{transform:scale(1.08)}
@keyframes pop{from{opacity:0;transform:scale(.9)}}

.list{display:grid;gap:12px}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--paper);border:1px solid var(--line);border-radius:16px;transition:transform .25s,box-shadow .25s}
.row:hover{transform:translateX(calc(var(--dx,1) * 4px));box-shadow:var(--shadow)}
[dir=rtl] .row:hover{transform:translateX(-4px)}
.row .fi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--ochre-l);color:#7a5b12;flex:none}
.row .rn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.row a.btn{text-decoration:none;color:inherit}
.videos{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.vcard{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);transition:transform .3s,box-shadow .3s}
.vcard:hover{transform:translateY(-4px);box-shadow:var(--shadow-up)}
.vcard iframe{width:100%;aspect-ratio:16/9;border:0;display:block;background:var(--sand)}
.vcard .vh{display:flex;align-items:center;gap:10px;padding:12px 14px}
.vcard .vh b{flex:1;min-width:0;font-weight:500}
.vlink{aspect-ratio:16/9;display:grid;place-items:center;background:var(--moss-l);color:var(--moss-d);text-decoration:none}
.vlink .ic{width:46px;height:46px;transition:transform .3s}
.vcard:hover .vlink .ic{transform:scale(1.15)}
.xbtn{border:0;background:transparent;border-radius:10px;width:34px;height:34px;display:grid;place-items:center;color:var(--muted);transition:.2s;flex:none}
.xbtn:hover{background:#F3DDD5;color:var(--danger);transform:scale(1.1)}

/* worksheet */
.twrap{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:24px;align-items:start}
.sheet{position:relative;background:var(--paper);border-radius:8px;box-shadow:var(--shadow-up);padding:26px 0 22px;font-family:'Amiri','Readex Pro',serif;font-size:1.3rem;overflow:hidden}
[lang=en] .sheet{font-family:'Lora',Georgia,serif;font-size:1.1rem}
.sheet::before{content:'';position:absolute;inset-block:0;inset-inline-start:66px;width:2px;background:#E6D49A}
.sheet::after{content:'';position:absolute;inset-block:0;inset-inline-start:14px;width:18px;background:radial-gradient(circle at 9px 70px,var(--bg) 7px,#C8D4BA 8px,transparent 9px) 0 0/18px 190px repeat-y}
.shead{padding:0 26px 14px 26px;padding-inline-start:90px;display:flex;flex-direction:column;gap:2px}
.shead h2{margin:0;font-size:1.7rem;line-height:1.3}
.shead .date{font-size:1rem;color:var(--muted);font-family:'Readex Pro',sans-serif}
.prog{height:8px;background:var(--moss-l);border-radius:8px;overflow:hidden;margin-top:10px;max-width:340px}
.prog i{display:block;height:100%;background:var(--moss);border-radius:8px;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.prog-t{font-family:'Readex Pro',sans-serif;font-size:.85rem;color:var(--muted)}
.lines{list-style:none;margin:6px 0 0;padding:0;min-height:264px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 43px,#CBD8BD 43px,#CBD8BD 44px);border-top:1px solid #CBD8BD}
.trow{display:flex;align-items:flex-start;min-height:44px;animation:rowin .35s backwards}
@keyframes rowin{from{opacity:0;transform:translateX(calc(var(--s,1) * 14px))}}
[dir=rtl] .trow{--s:-1}
.trow .cw{width:66px;height:44px;display:grid;place-items:center;flex:none}
.trow .tt{flex:1;line-height:44px;padding-inline:18px 10px;min-width:0;word-break:break-word;transition:color .3s}
.trow.done .tt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--ochre);text-decoration-thickness:2px}
.trow .xbtn{margin:5px 10px 0;opacity:0}
.trow:hover .xbtn,.trow .xbtn:focus-visible{opacity:1}
@media (hover:none){.trow .xbtn{opacity:1}}
.chk{position:relative;display:inline-block;width:26px;height:26px;cursor:pointer}
.chk input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%}
.chk .box{position:absolute;inset:0;border:2px solid var(--moss);border-radius:7px;background:var(--paper);display:grid;place-items:center;transition:background .2s,transform .2s}
.chk:hover .box{transform:scale(1.1)}
.chk .box svg{width:18px;height:18px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s .05s}
.chk input:checked+.box{background:var(--moss-d);border-color:var(--moss-d)}
.chk input:checked+.box svg{stroke-dashoffset:0}
.chk input:focus-visible+.box{outline:3px solid var(--ochre);outline-offset:2px}
.chk input:disabled{cursor:default}
.addrow{display:flex;gap:10px;padding:18px 26px 0;padding-inline-start:90px;font-family:'Readex Pro',sans-serif;font-size:1rem}
.addrow input{flex:1;min-width:0;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;transition:border-color .2s,box-shadow .2s}
.addrow input:focus{outline:0;border-color:var(--moss);box-shadow:0 0 0 4px var(--moss-l)}
.sfoot{display:flex;gap:10px;flex-wrap:wrap;padding:16px 26px 0;padding-inline-start:90px;font-family:'Readex Pro',sans-serif;font-size:1rem}
.banner{margin:0 26px 10px;padding:10px 14px;padding-inline-start:90px;margin:0 0 10px;background:var(--ochre-l);font-family:'Readex Pro',sans-serif;font-size:.9rem;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.saved{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;position:sticky;top:84px}
.saved h3{margin:0 0 10px;font-size:1rem;font-weight:600}
.sv{display:flex;align-items:center;gap:4px;margin-bottom:6px}
.sv .go{flex:1;text-align:start;border:1px solid transparent;background:transparent;padding:9px 12px;border-radius:12px;display:flex;flex-direction:column;transition:background .2s,transform .2s}
.sv .go:hover{background:var(--moss-l);transform:translateX(calc(var(--s,1) * 3px))}
[dir=rtl] .sv .go:hover{transform:translateX(-3px)}
.sv .go.on{background:var(--moss-l);border-color:var(--moss)}
.sv small{color:var(--muted)}
.sv .xbtn{opacity:.6}

/* settings */
.sgrid{display:grid;gap:18px;max-width:760px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
.panel h2{margin:0 0 6px;font-size:1.1rem;font-weight:600}
.panel p{margin:0 0 14px;color:var(--muted);font-size:.92rem}
.bar{height:12px;border-radius:12px;background:var(--moss-l);overflow:hidden;margin:6px 0 10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--moss),var(--ochre));border-radius:12px;transition:width .6s}
.btns{display:flex;gap:10px;flex-wrap:wrap}

/* modal, toast, lightbox */
.ov{position:fixed;inset:0;z-index:100;background:rgba(37,56,43,.45);display:grid;place-items:center;padding:16px;opacity:0;transition:opacity .2s}
.ov.show{opacity:1}
.modal{background:var(--paper);border-radius:22px;padding:24px;width:min(440px,100%);box-shadow:var(--shadow-up);transform:translateY(16px) scale(.96);transition:transform .25s cubic-bezier(.2,.7,.2,1)}
.ov.show .modal{transform:none}
.modal h2{margin:0 0 14px;font-size:1.15rem;font-weight:600}
.modal p{margin:0 0 6px}
.modal label{display:block;font-size:.88rem;color:var(--muted);margin:10px 0 4px}
.modal input{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px}
.modal input:focus{outline:0;border-color:var(--moss);box-shadow:0 0 0 4px var(--moss-l)}
.modal input.bad{border-color:var(--danger);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.mbtns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:20px}
#toasts{position:fixed;inset-inline:0;bottom:90px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:200;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;box-shadow:var(--shadow-up);animation:toast .3s,toastout .3s 2.6s forwards;max-width:90vw}
@keyframes toast{from{opacity:0;transform:translateY(12px)}}
@keyframes toastout{to{opacity:0;transform:translateY(8px)}}
.lb{position:fixed;inset:0;z-index:150;background:rgba(28,40,31,.92);display:none;align-items:center;justify-content:center}
.lb.show{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.lbstage{width:100%;height:100%;display:grid;place-items:center;overflow:auto;padding:60px 70px}
.lbstage img{max-width:100%;max-height:100%;border-radius:10px;cursor:zoom-in;transition:transform .3s;animation:pop .3s}
.lbstage img.z{transform:scale(1.9);cursor:zoom-out}
.lbb{position:absolute;border:0;background:rgba(251,250,243,.16);color:#fff;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;transition:background .2s,transform .2s}
.lbb:hover{background:rgba(251,250,243,.32);transform:scale(1.1)}
.lbb.l{left:14px;top:50%;margin-top:-23px}.lbb.r{right:14px;top:50%;margin-top:-23px}
.lbb.x{top:14px;inset-inline-end:14px}
.lbb.d{top:14px;inset-inline-start:14px}
.lbc{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:#E9EFE2;font-size:.9rem}

.notice{background:var(--ochre-l);border:1px solid #E2CE88;border-radius:14px;padding:10px 14px;margin-bottom:16px;font-size:.9rem}

@media (max-width:900px){
  .twrap{grid-template-columns:1fr}.saved{position:static}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:8px 10px;z-index:30;border-inline-end:0;border-top:1px solid var(--line);justify-content:space-around;gap:4px}
  .brand,.sidefoot{display:none}
  .nav{flex-direction:column;gap:2px;padding:8px 10px;font-size:.75rem;flex:1;align-items:center;text-align:center}
  .nav:hover{padding-inline-start:10px}
  .nav.on::after{display:none}
  .fab{bottom:88px}
  .fab-side{top:auto;bottom:160px}
  #toasts{bottom:160px}
  .lbstage{padding:60px 12px}
  .sheet::before{inset-inline-start:52px}
  .trow .cw{width:52px}
  .shead,.addrow,.sfoot,.banner{padding-inline-start:72px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main">
    <header class="top" id="top"></header>
    <div id="view" class="view"></div>
  </main>
</div>
<div id="toasts"></div>
<div class="lb" id="lb">
  <button class="lbb x" data-lb="close" aria-label="close"></button>
  <button class="lbb d" data-lb="del" aria-label="delete"></button>
  <button class="lbb l" data-lb="left" aria-label="left"></button>
  <button class="lbb r" data-lb="right" aria-label="right"></button>
  <div class="lbstage" data-lb="bg"><img id="lbimg" alt=""></div>
  <div class="lbc" id="lbc"></div>
</div>

<script>
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayKey = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const fmtBytes = b => b > 1073741824 ? (b / 1073741824).toFixed(2) + ' GB' : b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';

const IC = {
  plus:'<path d="M12 5v14M5 12h14"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/>',
  back:'<path d="M9 6l6 6-6 6"/>',
  folder:'<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/>',
  image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 9"/>',

/* ---------- storage (IndexedDB, with in-memory fallback) ---------- */
const DB = {
  mode:'idb', db:null, mem:{ state:null, files:new Map() },
  async init(){
    try{
      await new Promise((res, rej) => {
        const r = indexedDB.open('rmdpack', 1);
        r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('files', { keyPath:'id' }); };
        r.onsuccess = () => { this.db = r.result; res(); };
        r.onerror = () => rej(r.error);
      });
    }catch(e){ this.mode = 'mem'; }
  },
  tx(store, mode, fn){
    return new Promise((res, rej) => {
      const tx = this.db.transaction(store, mode);
      const rq = fn(tx.objectStore(store));
      tx.oncomplete = () => res(rq ? rq.result : undefined);
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error);
    });
  },
  async getState(){ return this.mode === 'mem' ? this.mem.state : this.tx('kv', 'readonly', s => s.get('state')); },
  async setState(v){ if (this.mode === 'mem') { this.mem.state = v; return; } return this.tx('kv', 'readwrite', s => s.put(v, 'state')); },
  async putFile(f){ if (this.mode === 'mem') { this.mem.files.set(f.id, f); return; } return this.tx('files', 'readwrite', s => s.put(f)); },
  async getFile(id){ return this.mode === 'mem' ? this.mem.files.get(id) : this.tx('files', 'readonly', s => s.get(id)); },
  async delFile(id){ if (this.mode === 'mem') { this.mem.files.delete(id); return; } return this.tx('files', 'readwrite', s => s.delete(id)); },
  async allFiles(){ return this.mode === 'mem' ? [...this.mem.files.values()] : this.tx('files', 'readonly', s => s.getAll()); },
  async clearFiles(){ if (this.mode === 'mem') { this.mem.files.clear(); return; } return this.tx('files', 'readwrite', s => s.clear()); }
};
const urlCache = new Map();
async function getUrl(id){
  if (urlCache.has(id)) return urlCache.get(id);
  const f = await DB.getFile(id);
  if (!f) return '';
  const u = URL.createObjectURL(f.blob);
  urlCache.set(id, u);
  return u;
}

}

function toast(msg){
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}
function modal({ title, body = '', buttons }){
  return new Promise(res => {
    const ov = document.createElement('div');
    ov.className = 'ov';
    ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h2>${esc(title)}</h2>${body}<div class="mbtns">${buttons.map((b, i) => `<button class="btn ${b.cls || ''}" data-i="${i}">${esc(b.label)}</button>`).join('')}</div></div>`;
    document.body.appendChild(ov);
    requestAnimationFrame(() => ov.classList.add('show'));
    const close = v => { document.removeEventListener('keydown', onKey, true); ov.classList.remove('show'); setTimeout(() => ov.remove(), 220); res(v); };
    const submit = () => {
      const o = {}; let bad = null;
      ov.querySelectorAll('input[name]').forEach(i => {
        o[i.name] = i.value.trim();
        if (i.dataset.req && !o[i.name]) { bad = bad || i; i.classList.remove('bad'); void i.offsetWidth; i.classList.add('bad'); }
      });
      if (bad) { bad.focus(); return; }
      close(o);
    };
    const onKey = e => {
      if (e.key === 'Escape') { e.stopPropagation(); close(null); }
      else if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); submit(); }
    };
    document.addEventListener('keydown', onKey, true);
    ov.addEventListener('click', e => {
      const b = e.target.closest('button[data-i]');
      if (b) { const bt = buttons[b.dataset.i]; return bt.submit ? submit() : close(bt.val); }
      if (e.target === ov) close(null);
    });
    setTimeout(() => { const i = ov.querySelector('input'); if (i) { i.focus(); i.select(); } }, 60);
  });
}
const ask = (title, fields, okLabel) => modal({

function pick(accept, multiple){
  return new Promise(res => {
    const i = document.createElement('input');
    i.type = 'file'; i.accept = accept; i.multiple = !!multiple; i.style.display = 'none';
    i.onchange = () => { res([...i.files]); i.remove(); };
    document.body.appendChild(i);
    i.click();
  });
}

}

function tasksView(){
  const sv = V.saved && S.tasks.saved[V.saved] ? V.saved : null;
  const sheet = sv ? S.tasks.saved[sv] : S.tasks.cur;
  const items = sheet.items, done = items.filter(i => i.done).length;
  const pct = items.length ? Math.round(done / items.length * 100) : 0;
  const loc = S.lang === 'ar' ? 'ar' : 'en-GB';
  const fmtDate = k => new Date(k + 'T12:00:00').toLocaleDateString(loc, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  const tick = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const rows = items.map((it, i) => `<li class="trow ${it.done ? 'done' : ''}" style="animation-delay:${Math.min(i, 10) * 25}ms"><span class="cw"><label class="chk"><input type="checkbox" ${it.done ? 'checked' : ''} ${sv ? 'disabled' : ''} data-act="toggle-task" data-id="${it.id}"><span class="box">${tick}</span></label></span><span class="tt">${esc(it.text)}</span>${sv ? '' : `<button class="xbtn" data-act="del-task" data-id="${it.id}" aria-label="${t('delete')}">${ic('close')}</button>`}</li>`).join('');
  const keys = Object.keys(S.tasks.saved).sort().reverse();
  return `<div class="twrap">
    <section class="sheet">
      ${sv ? `<div class="banner"><span>${t('viewing')}</span><span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="copy-open">${t('copy_open')}</button><button class="btn primary" data-act="back-today">${t('back_today')}</button></span></div>` : ''}
      <div class="shead">
        <h2>${t('tasks_head')}</h2>
        <span class="date">${fmtDate(sheet.date)}</span>
        <div class="prog"><i style="width:${pct}%"></i></div>
        <span class="prog-t">${t('done_of', { a:done, b:items.length })}</span>
      </div>
      <ul class="lines">${rows || `<li class="trow"><span class="cw"></span><span class="tt" style="color:var(--muted)">${t('empty_tasks')}</span></li>`}</ul>
      ${sv ? '' : `<form class="addrow" data-form="add-task"><input name="text" placeholder="${esc(t('add_task_ph'))}" autocomplete="off" aria-label="${esc(t('add_task_ph'))}"><button class="btn primary">${ic('plus')}${t('add')}</button></form>
      <div class="sfoot"><button class="btn primary" data-act="save-day">${ic('download')}${t('save_day')}</button><button class="btn" data-act="clear-done">${t('clear_done')}</button></div>`}
    </section>
    <aside class="saved"><h3>${t('saved_days')}</h3>
      ${keys.length ? keys.map(k => { const s = S.tasks.saved[k]; const d = s.items.filter(i => i.done).length; return `<div class="sv"><button class="go ${sv === k ? 'on' : ''}" data-act="view-saved" data-id="${k}"><span>${fmtDate(k)}</span><small>${t('done_of', { a:d, b:s.items.length })}</small></button><button class="xbtn" data-act="del-saved" data-id="${k}" aria-label="${t('delete')}">${ic('trash')}</button></div>`; }).join('') : `<span style="color:var(--muted);font-size:.9rem">${t('no_saved')}</span>`}
    </aside></div>`;
}

function settingsView(){
  return `<div class="sgrid">
    <section class="panel"><h2>${t('s_storage')}</h2><p>${t('s_note')}</p>
      <div id="usage"><div class="bar"><i style="width:0"></i></div><span style="font-size:.9rem;color:var(--muted)">…</span></div>
      <div class="btns" style="margin-top:12px"><button class="btn" data-act="persist">${ic('shield')}${t('s_persist')}</button></div>
    </section>
    <section class="panel"><h2>${t('s_data')}</h2><p>${t('s_data_p')}</p>
      <div class="btns"><button class="btn primary" data-act="export">${ic('download')}${t('s_export')}</button><button class="btn" data-act="import">${ic('upload')}${t('s_import')}</button></div>
    </section>
    <section class="panel"><h2>${t('s_danger')}</h2><p>${t('s_danger_p')}</p>
      <div class="btns"><button class="btn danger" data-act="clear-all">${ic('trash')}${t('clear_all')}</button></div>
    </section></div>`;
}

async function hydrate(){
  document.querySelectorAll('img[data-fid]').forEach(async im => { im.src = await getUrl(im.dataset.fid); });
  document.querySelectorAll('a[data-furl]').forEach(async a => { a.href = await getUrl(a.dataset.furl); });
  if (V.page === 'settings') {
    const box = $('#usage');
    try {
      const e = await navigator.storage.estimate();
      const pct = e.quota ? Math.min(100, (e.usage / e.quota) * 100) : 0;
      if (box) box.innerHTML = `<div class="bar"><i style="width:${Math.max(pct, 1)}%"></i></div><span style="font-size:.9rem;color:var(--muted)">${t('s_used', { u:fmtBytes(e.usage), q:fmtBytes(e.quota) })}</span>`;
    } catch (_) { if (box) box.innerHTML = ''; }
  }
}

/* ---------- lightbox ---------- */
const lb = { i:0, open:false };
function lbList(){ const l = L(); return l ? l.images : []; }
async function lbShow(i){
  const list = lbList(); if (!list.length) return lbClose();
  lb.i = (i + list.length) % list.length;
  const im = $('#lbimg'); im.classList.remove('z');
  im.src = await getUrl(list[lb.i]);
  $('#lbc').textContent = t('img_n', { a:lb.i + 1, b:list.length });
}
function lbOpen(i){
  lb.open = true; $('#lb').classList.add('show');
  $('[data-lb=close]').innerHTML = ic('close'); $('[data-lb=del]').innerHTML = ic('trash');
  $('[data-lb=left]').innerHTML = ic('left'); $('[data-lb=right]').innerHTML = ic('right');
  lbShow(i);
}
function lbClose(){ lb.open = false; $('#lb').classList.remove('show'); }
const lbStep = dirPhys => { const rtl = S.lang === 'ar'; lbShow(lb.i + (dirPhys === 'left' ? (rtl ? 1 : -1) : (rtl ? -1 : 1))); };
$('#lb').addEventListener('click', async e => {
  const b = e.target.closest('[data-lb]');
  if (e.target.id === 'lbimg') return e.target.classList.toggle('z');
  if (!b) return;
  const a = b.dataset.lb;
  if (a === 'close' || a === 'bg') lbClose();
  else if (a === 'left' || a === 'right') lbStep(a);
  else if (a === 'del') {
    if (await confirmBox(t('del_img'))) {
      const l = L(), id = l.images[lb.i];
      l.images.splice(lb.i, 1); await DB.delFile(id); urlCache.delete(id); save(); draw(false);
      l.images.length ? lbShow(Math.min(lb.i, l.images.length - 1)) : lbClose();
    }
  }
});
document.addEventListener('keydown', e => {
  if (!lb.open || document.querySelector('.ov')) return;
  if (e.key === 'Escape') lbClose();
  if (e.key === 'ArrowLeft') lbStep('left');
  if (e.key === 'ArrowRight') lbStep('right');
});

/* ---------- actions ---------- */
function fileIds(l){ return [...l.images, ...l.pdfs.map(p => p.id)]; }
async function dropFiles(ids){ for (const id of ids) { await DB.delFile(id); urlCache.delete(id); } }
const blobToData = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });

async function act(a, el){
  const id = el.dataset.id;
  switch (a) {
    case 'nav': return go(el.dataset.page);
    case 'lang': S.lang = S.lang === 'ar' ? 'en' : 'ar'; save(); return draw(false);
    case 'back': return V.page === 'lesson' ? go('group', { gid:V.gid }) : go('home');
    case 'new-group': {
      const r = await ask(t('new_group'), [{ name:'name', label:t('group_name'), ph:t('group_ph'), req:true }]);
      if (r) { S.groups.push({ id:uid(), name:r.name, lessons:[] }); save(); draw(false); }
      return;
    }
    case 'open-group': return go('group', { gid:id });
    case 'rename-group': {
      const g = S.groups.find(x => x.id === id);
      const r = await ask(t('rename'), [{ name:'name', label:t('group_name'), value:g.name, req:true }]);
      if (r) { g.name = r.name; save(); draw(false); }
      return;
    }
    case 'del-group': {
      const g = S.groups.find(x => x.id === id);
      if (await confirmBox(t('del_group', { n:g.name }))) {
        for (const l of g.lessons) await dropFiles(fileIds(l));
        S.groups = S.groups.filter(x => x.id !== id); save(); draw(false);
      }
      return;
    }
    case 'new-lesson': {
      const r = await ask(t('add_lesson'), [{ name:'name', label:t('lesson_name'), ph:t('lesson_ph'), req:true }], t('add'));
      if (r) { G().lessons.push({ id:uid(), name:r.name, images:[], pdfs:[], videos:[] }); save(); draw(false); }
      return;
    }
    case 'open-lesson': return go('lesson', { gid:V.gid, lid:id });
    case 'rename-lesson': {
      const l = G().lessons.find(x => x.id === id);
      const r = await ask(t('rename'), [{ name:'name', label:t('lesson_name'), value:l.name, req:true }]);
      if (r) { l.name = r.name; save(); draw(false); }
      return;
    }
    case 'del-lesson': {
      const g = G(), l = g.lessons.find(x => x.id === id);
      if (await confirmBox(t('del_lesson', { n:l.name }))) { await dropFiles(fileIds(l)); g.lessons = g.lessons.filter(x => x.id !== id); save(); draw(false); }
      return;
    }
    case 'tab': V.tab = el.dataset.tab; return draw(true);
    case 'upload-images': {
      const files = await pick('image/*', true); if (!files.length) return;
      const l = L();
      try { for (const f of files) { const fid = uid(); await DB.putFile({ id:fid, name:f.name, type:f.type, blob:f }); l.images.push(fid); } }
      catch (e) { toast(t('upload_fail')); }
      save(); return draw(false);
    }
    case 'open-img': return lbOpen(+el.dataset.i);
    case 'upload-pdf': {
      const files = await pick('application/pdf,.pdf', true); if (!files.length) return;
      const l = L();
      try { for (const f of files) { const fid = uid(); await DB.putFile({ id:fid, name:f.name, type:'application/pdf', blob:new Blob([f], { type:'application/pdf' }) }); l.pdfs.push({ id:fid, name:f.name }); } }
      catch (e) { toast(t('upload_fail')); }
      save(); return draw(false);
    }
    case 'del-pdf': {
      if (await confirmBox(t('del_file'))) { const l = L(); l.pdfs = l.pdfs.filter(p => p.id !== id); await dropFiles([id]); save(); draw(false); }
      return;
    }
    case 'add-video': {
      const r = await ask(t('add_video'), [{ name:'title', label:t('video_title'), ph:t('video_title_ph'), req:true }, { name:'url', label:t('video_url'), ph:t('video_url_ph'), req:true, dir:'ltr' }], t('add'));
      if (!r) return;
      let u = r.url; if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
      try { new URL(u); } catch (_) { return toast(t('bad_url')); }
      L().videos.push({ id:uid(), title:r.title, url:u }); save(); return draw(false);
    }
    case 'del-video': {
      if (await confirmBox(t('del_video'))) { const l = L(); l.videos = l.videos.filter(v => v.id !== id); save(); draw(false); }
      return;
    }
    case 'toggle-task': {
      const it = S.tasks.cur.items.find(x => x.id === id);
      if (it) { it.done = el.checked; save(); draw(false); }
      return;
    }
    case 'del-task': S.tasks.cur.items = S.tasks.cur.items.filter(x => x.id !== id); save(); return draw(false);
    case 'save-day': S.tasks.saved[S.tasks.cur.date] = clone(S.tasks.cur); save(); draw(false); return toast(t('day_saved'));
    case 'clear-done': S.tasks.cur.items = S.tasks.cur.items.filter(x => !x.done); save(); return draw(false);
    case 'view-saved': V.saved = id; return draw(false);
    case 'back-today': V.saved = null; return draw(false);
    case 'copy-open': {
      const src = S.tasks.saved[V.saved]; if (!src) return;
      const have = new Set(S.tasks.cur.items.map(i => i.text));
      src.items.filter(i => !i.done && !have.has(i.text)).forEach(i => S.tasks.cur.items.push({ id:uid(), text:i.text, done:false }));
      save(); V.saved = null; draw(false); return toast(t('copied'));
    }
    case 'del-saved': {
      if (await confirmBox(t('del_saved'))) { delete S.tasks.saved[id]; if (V.saved === id) V.saved = null; save(); draw(false); }
      return;
    }
    case 'persist': {
      try { const ok = await navigator.storage.persist(); toast(ok ? t('s_persisted') : t('s_persist_fail')); } catch (_) { toast(t('s_persist_fail')); }
      return;
    }
    case 'export': {
      const files = [];
      for (const f of await DB.allFiles()) files.push({ id:f.id, name:f.name, type:f.type, data:await blobToData(f.blob) });
      const blob = new Blob([JSON.stringify({ app:'rmdpack', version:1, state:S, files })], { type:'application/json' });
      const a2 = document.createElement('a'); a2.href = URL.createObjectURL(blob); a2.download = 'rmd-pack-backup-' + todayKey() + '.json';
      document.body.appendChild(a2); a2.click(); a2.remove(); setTimeout(() => URL.revokeObjectURL(a2.href), 3000);
      return toast(t('exported'));
    }
    case 'import': {
      const [f] = await pick('application/json,.json', false); if (!f) return;
      let data;
      try { data = JSON.parse(await f.text()); if (data.app !== 'rmdpack' || !data.state || !Array.isArray(data.state.groups)) throw 0; } catch (_) { return toast(t('import_bad')); }
      const mode = await modal({ title:t('import_ask'), buttons:[{ label:t('cancel'), val:null }, { label:t('import_merge'), cls:'primary', val:'merge' }, { label:t('import_replace'), cls:'danger', val:'replace' }] });
      if (!mode) return;
      try {
        if (mode === 'replace') { await DB.clearFiles(); urlCache.clear(); }
        for (const f2 of data.files || []) { const blob = await (await fetch(f2.data)).blob(); await DB.putFile({ id:f2.id, name:f2.name, type:f2.type, blob }); }
        if (mode === 'replace') { const lang = S.lang; S = Object.assign(defaultState(), data.state, { lang }); }
        else {
          data.state.groups.forEach(g => S.groups.push({ ...g, id:uid() }));
          const sv = (data.state.tasks && data.state.tasks.saved) || {};
          Object.keys(sv).forEach(k => { if (!S.tasks.saved[k]) S.tasks.saved[k] = sv[k]; });
        }
        rollover(); await save(); go('home'); toast(t('import_done'));
      } catch (e) { toast(t('import_bad')); }
      return;
    }
    case 'clear-all': {
      if (await confirmBox(t('clear_confirm'))) {
        await DB.clearFiles(); urlCache.clear();
        const lang = S.lang; S = defaultState(); S.lang = lang; await save(); go('home'); toast(t('cleared'));
      }
      return;
    }
  }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && !el.closest('.ov')) act(el.dataset.act, el);
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-act]')) { e.preventDefault(); act(e.target.dataset.act, e.target); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form=add-task]'); if (!f) return;
  e.preventDefault();
  const text = f.elements.text.value.trim(); if (!text) return;
  S.tasks.cur.items.push({ id:uid(), text, done:false });
  save(); draw(false);
  const inp = $('.addrow input'); if (inp) inp.focus();
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && S) { const before = S.tasks.cur.date; rollover(); if (before !== S.tasks.cur.date && V.page === 'tasks') draw(false); }
});

/* ---------- start ---------- */
(async function init(){
  await DB.init();
  try { S = await DB.getState(); } catch (_) { S = null; }
  S = Object.assign(defaultState(), S || {});
  rollover();
  draw(true);
})();
</script>
</body>
</html>
